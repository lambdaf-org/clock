<svg xmlns="http://www.w3.org/2000/svg" width="1244" height="626" viewBox="0 0 1244 626" font-family="'Helvetica Neue', 'Arial', 'Segoe UI', system-ui, sans-serif">
<rect x="0" y="0" width="1244" height="626" rx="16" fill="#1a1b1e"/>
<text x="46" y="48" fill="#e8eaed" font-size="22" font-weight="700">Earned roles</text>
<text x="46" y="74" fill="#9aa0a6" font-size="13.5">A local all-MiniLM-L6-v2 model classifies each member’s weekly activity into a themed role. Colour and lettering escalate with weekly hours.</text>
